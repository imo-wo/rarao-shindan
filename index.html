.noise {

}

button { font: inherit; }
.app-shell { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 80px; }
.screen { display: none; }
.screen.is-active { display: block; animation: fade .28s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.hero-card, .question-card, .result-card {
  background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01)), var(--card);
  border: 1px solid var(--line);

}
.hero-card { padding: clamp(36px, 8vw, 80px); margin-top: 7vh; text-align: center; }
.hero-card h1 { font-size: clamp(42px, 8vw, 76px); line-height: 1.08; margin: 12px 0 24px; letter-spacing: -.04em; }
.lead { font-size: clamp(18px, 3vw, 24px); max-width: 720px; margin: 0 auto 12px; }
.sublead { color: var(--muted); margin-bottom: 36px; }
.eyebrow { margin: 0; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .18em; }

.primary-btn, .secondary-btn, .text-btn {
  border: 0; cursor: pointer; border-radius: 999px; transition: .18s ease;
}
.primary-btn { background: var(--text); color: #101014; padding: 14px 24px; font-weight: 800; }

.text-btn { background: transparent; color: var(--muted); padding: 8px; }

.quiz-header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 22px; }

.progress-track { height: 5px; margin-top: 10px; background: #25252b; border-radius: 99px; overflow: hidden; }

  border-radius: 18px; padding: 18px 20px; cursor: pointer; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: start;

.nav-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }

.result-card { text-align: center; padding: clamp(36px, 7vw, 68px); margin-top: 4vh; }

.result-copy { text-align: left; max-width: 680px; margin: 0 auto; }

.result-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 34px; }

.answers-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 24px; }
.answers-head h2 { margin: 6px 0 0; font-size: clamp(34px, 6vw, 54px); }
.answers-head p { color: var(--muted); }
.your-choice-chip { display: inline-block; color: #17171b; background: var(--accent-2); border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 800; }
.answer-list { display: grid; gap: 18px; }
.answer-block { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.answer-block summary { cursor: pointer; padding: 22px 24px; list-style: none; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.answer-block summary::-webkit-details-marker { display: none; }
.answer-block summary h3 { margin: 0; font-size: 20px; }
.answer-block summary .selected-summary { color: var(--accent-2); font-size: 13px; font-weight: 800; white-space: nowrap; }
.answer-content { border-top: 1px solid var(--line); padding: 24px; }
.intent { padding: 18px 20px; border-radius: 16px; background: #1c1c22; margin-bottom: 18px; }
.intent h4 { margin: 0 0 8px; font-size: 18px; }
.intent p { margin: .55em 0; }
.feedback-item { border-top: 1px solid #2b2b32; padding: 20px 0; }
.feedback-item:first-of-type { border-top: 0; }
.feedback-item.is-user-choice { background: rgba(255,179,71,.06); margin: 0 -12px; padding: 20px 12px; border-radius: 14px; }
.feedback-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-weight: 900; }

.feedback-item p { margin: .6em 0; }
.feedback-item blockquote { margin: .8em 0; padding: .2em 0 .2em 1em; border-left: 3px solid var(--accent); color: #dddbe1; }
.footer-actions { text-align: center; margin-top: 32px; }

@media (max-width: 640px) {
  .app-shell { width: min(100% - 20px, 920px); padding-top: 20px; }
  .hero-card, .question-card, .result-card { border-radius: 20px; }
  .quiz-header, .answers-head { align-items: flex-start; }
  .answers-head { flex-direction: column; }
  .nav-row > button { flex: 1; }
  .option-btn { grid-template-columns: 32px 1fr; padding: 16px; }
}

<body>

  <script>
const q = (id, title, body, options, intentTitle, intentHtml, feedback) => ({ id, title, body, options, intentTitle, intentHtml, feedback });
const o = (letter, text, score) => ({ letter, text, score });
const f = (letter, html) => ({ letter, html });

const questions = [
  q(1, 'ららーおが突然、音楽を流し始めました', `
    <p class=\"situation\">あなたとららーおは、家でのんびり音楽を聴きながら過ごしています。</p>
    <p>二人で同じ部屋にいるとき、ららーおが何も言わずに突然、曲を流し始めました。</p>
    <p>あなた自身、この曲は知らない曲でしたが、結構いい曲です。</p>
    <p><strong>さて、あなたならどうしちゃう？</strong></p>`, [
      o('A','曲の途中で「これ誰の曲？」',5),
      o('B','特に何も言わず、そのまま一緒に聴く',3),
      o('C','曲を聴いている途中で「え、めっちゃいい曲やん」',7),
      o('D','曲が終わってから「これなんて曲？」',10),
      o('E','実は知ってる曲だったので、途中から鼻歌で一緒に歌い始める',0),
    ], '🎧 この問題で見ていたこと', `
      <p><strong>ららーおが突然流した曲に、あなたがどう付き合ってくれるか。</strong></p>
      <p>ららーおはどうやら、この時間の扱いにちょっとだけこだわりがあります。</p>`, [
      f('A',`<p>これも嬉しいです。興味持ってくれてるので。</p><p>ただ、やっぱり、</p><p><strong>（あとで全部教えるから、とりあえず今は聴こう）</strong></p><p>が若干います。</p><p>質問は大歓迎。タイミングだけ、もう一息。</p>`),
      f('B',`<p>全然いいです。むしろ最後まで聴いてくれてありがとう。</p><p>……ただ。</p><p>曲が終わっても何もないと、</p><p><strong>「……で？」</strong></p><p>が心の中に少しだけ現れます。</p><p>せっかくららーおが突然流したので、何か一言くらい触れてくれると喜びます。</p>`),
      f('C',`<p>かなり嬉しい。</p><p>「いい曲」と思ってくれたこと自体は普通に嬉しいので、高得点です。</p><p>ただしららーおは心のどこかで、</p><p><strong>（ありがとう。でも一旦最後まで聴いて）</strong></p><p>とも思っています。</p><p>嬉しい。嬉しいんです。<br>ただ、まだ曲は終わっていません。</p>`),
      f('D',`<p>これです。これが一番嬉しい。</p><p>まず最後まで聴いてくれた。<br>そして、終わってから曲について聞いてくれた。</p><p><strong>ちゃんと一曲聴いたうえで興味を持ってくれた</strong>というのが、かなり嬉しいです。</p><p>ちなみにこの瞬間、ららーおの中では「よし、流してよかった」が発生しています。</p>`),
      f('E',`<p>まさかの既知。</p><p>ららーおとしては、</p><p><strong>「なんだよ、知ってんのかよ」</strong></p><p>です。</p><p>しかも鼻歌まで始まった。<br>完全にららーおよりこの曲との付き合いが長そうです。</p><p>ららーおはたぶん、<strong>あなたにこの曲を紹介したかった</strong>んです。</p><p>その小さな野望が、鼻歌によって静かに散りました。</p>`),
    ]),

  q(2, 'ららーおがめっちゃおいしそうに食べています', `
    <p class=\"situation\">あなたとららーおは、夏祭りの屋台を見ながら食べ歩きをしています。</p>
    <p>ららーおが、</p><p>「これ、めっちゃおいしい」</p><p>と言いながら、自分で買ったものを食べています。</p>
    <p><strong>さて、あなたならどうしちゃう？</strong></p>`, [
      o('A','「おいしそう。どこで買ったの？」',5),
      o('B','自分も食べたくなって、じっと視線を送る',10),
      o('C','「一口ちょうだい！」',7),
      o('D','特に何も言わず、自分のものを食べる',0),
      o('E','「あとでららーおも買おうかな」',3),
    ], '🍰 この問題で見ていたこと', `
      <p><strong>ららーおがおいしそうに食べているものを、あなたも食べたくなったときどうするか。</strong></p>
      <p>人がめちゃくちゃおいしそうに食べているものって、ちょっと気になりますよね。</p>
      <p>しかも隣で「これめっちゃおいしい」とまで言われたら、なおさらです。</p>
      <p>ちなみにららーおは、<strong>自分がおいしいと思ったものは、わりとすぐ人にも食べてほしくなるタイプです。</strong></p>
      <p>なので遠慮はそんなにいりません。むしろ、食べたそうにしているのを発見すると喜びます。</p>`, [
      f('A',`<p>お、気になってる。</p><p>嬉しいです。どこで買ったかはもちろん教えます。</p><p>ただ、たぶんららーおは説明しながら、</p><p><strong>「いや、今ここにあるよ？食べる？」</strong></p><p>と思っています。</p><p>購入場所まで聞いてくれるくらいなら、一口いかがでしょうか。</p>`),
      f('B',`<p><strong>食べたいんだ（笑）。</strong></p><p>これ、めちゃくちゃ好きです。</p><p>「食べたい。でもららーおが買ったものだし、ららーおが食べてるし……」という気持ちが、視線から全部漏れています。</p><p>その<strong>食べたい気持ちと遠慮のせめぎ合い</strong>が、なんかすごく愛おしい。</p><p>そして、それに気づいたららーおの気持ちは一つです。</p><p><strong>「はい！好きなだけ食べな！！」</strong></p><p>むしろららーおから「食べる？」って差し出します。</p>`),
      f('C',`<p><strong>もちろん！食べてみてー！！</strong></p><p>全然くださいと言ってください。</p><p>むしろららーおは、自分がおいしいと思ったものを相手にも食べてもらえるのが嬉しいです。</p><p>「一口ちょうだい」と言われた瞬間、</p><p><strong>「そうでしょ？気になるでしょ？」</strong></p><p>くらいの気持ちで渡しています。</p><p>そして食べたあとの感想を、ちょっと楽しみにしています。</p>`),
      f('D',`<p>なるほど。</p><p><strong>全然興味なかった。</strong></p><p>それならそれで大丈夫です（笑）。</p><p>ららーおはおいしく食べ続けます。</p><p>ただ、こっちは「これめっちゃおいしい」と若干プレゼンを始めているので、</p><p><strong>一人で勝手におすすめして、一人で勝手に食べ終わります。</strong></p><p>平和です。</p>`),
      f('E',`<p><strong>そんな回りくどいことせずに、食べたいって言ってよ（笑）。</strong></p><p>もちろん自分の分を買って食べるのも全然いいんです。</p><p>でも今、目の前にあります。そしてららーおは普通にあげます。</p><p>なので、「あとで買おうかな……」と遠くのお店に思いを馳せる前に、<strong>一旦こっちを見てください。</strong></p><p>たぶんもう差し出す準備はできています。</p>`),
    ]),

  q(3, 'ららーおがずっと黙っています', `
    <p class=\"situation\">あなたとららーおは、夜に同じ部屋でそれぞれのんびり過ごしています。</p>
    <p>二人で過ごしていると、しばらく会話が途切れました。</p>
    <p>ららーおは特に気にしている様子もなく、普通に黙っています。</p>
    <p><strong>さて、あなたならどうしちゃう？</strong></p>`, [
      o('A','「なんか喋ろうよ〜」',5),
      o('B','特に気にせず、自分もそのまま過ごす',10),
      o('C','「そういえばさ」と普通に話題を出す',7),
      o('D','「なんでそんな静かなん（笑）」',0),
      o('E','「どうしたの？」',3),
    ], '🤫 この問題で見ていたこと', `
      <p><strong>二人の間に沈黙が流れたとき、それをどう扱うか。</strong></p>
      <p>仲のいい人と二人でいると、急に会話がなくなる瞬間ってありますよね。</p>
      <p>でもららーおはこの時間、<strong>びっくりするくらい何とも思っていません。</strong></p>
      `, [
      f('A',`<p>これは全然ありです。</p><p>少なくとも、</p><p><strong>「ららーおはあなたと喋りたいです」</strong></p><p>という意思表示なので、それ自体はむしろ嬉しい。</p><p>ただららーおはちょっとだけ、</p><p><strong>「いいよ。じゃあ何喋る？」</strong></p><p>と思っています。</p><p>喋りたい側からの話題提供も、セットでお待ちしております。</p>`),

  q(4, 'ららーおが好きな小説を熱烈におすすめしています', `

    ], '📚 この問題で見ていたこと', `

      f('B',`<p>律儀（笑）。</p><p>そこまでしてくれるとは思っていませんでした。もちろん嬉しいです。</p><p>ただ、安心してください。</p><p><strong>ららーおから後日「読んだ？」という抜き打ち検査が行われることは、ほぼありません。</strong></p><p>なんならその頃には、ららーおがおすすめしたことを忘れている可能性があります。</p><p>メモはあなたのペースでご活用ください。</p>`),

      f('D',`<p>お、本当にちょっと気になってる。</p><p>嬉しいです。</p><p>「読んでみようかな」と思うくらいには、ららーおの話が届いたらしい。</p><p>でも、ここから本当に読むかどうかは全然気にしません。</p><p><strong>調べてくれた時点で「お、興味持ってくれたんだ」と、ららーおはもうちょっと嬉しくなっています。</strong></p><p>あとは本当に、気が向いたときに読んでくれたらそれで十分です。</p>`),

  q(5, 'ららーおがあなたにプレゼントをあげました', `

      f('E',`<p>気持ちはめちゃくちゃ嬉しいです。</p><p>大事にしてくれてる。ありがとう。</p><p>でも。</p><p><strong>使って！！</strong></p><p>ららーおはあなたの家に<strong>展示品を納品したわけではありません。</strong></p><p>汚れてもいいし、多少くたびれてもいい。</p><p>むしろ半年後、ちょっと使用感が出ているくらいの方が、</p><p><strong>「おお……ちゃんと使われてる……」</strong></p><p>とららーおは喜びます。</p><p>大事にしてくれるなら、ぜひ<strong>使いながら大事にしてください。</strong></p>`),

  q(6, 'ららーおが食べたいものを聞かれました', `

      <p><strong>二人で何かを決めるとき、どこまで一緒に決めてくれるか。</strong></p>

      f('A',`<p>ありがとうございます。</p><p>決まりました。</p><p>この世にごまんとある食べ物の中から、ららーおがラーメンとお寿司まで絞りました。</p><p>そしてあなたが、ラーメンに決めました。</p><p>共同作業、完了です。</p><p>ららーおは全部あなたに決めてほしいわけでも、全部自分で決めたいわけでもありません。</p><p>この、</p><p><strong>ららーおが二択まで出す → あなたが最後を決める</strong></p><p>がかなり好きです。</p><p>ではラーメンを食べに行きましょう。</p><p>一緒に決めてくれたので、今日は特別に、</p><p><strong>チャーシューの一番美味しいところは、くれてやります。</strong></p>`),

  q(7, 'ららーおが明らかに落ち込んでいます', `
    <p class=\"situation\">あなたとららーおは、一日の終わりに一緒に過ごしています。</p>
    <p>今日は明らかにららーおの元気がありません。</p><p>何かあったっぽい。</p><p>あなたが「大丈夫？」と聞くと、ららーおは、</p><p>「うん、大丈夫」</p><p>と答えました。</p><p>でも、どう見てもいつも通りではありません。</p>
    <p><strong>さて、あなたならどうしちゃう？</strong></p>`, [
      o('A','「そっか」と言いつつ、なんとなくその場を離れずにいる',10),
      o('B','「ほんとに？なんかあったでしょ」と、もう一度聞く',5),
      o('C','「分かった」と、それ以上は触れずにいつも通り接する',7),

      o('E','「分かった。話したくなったら言ってね」と言って、そっとしておく',5),
    ], '☁️ この問題で見ていたこと', `
      <p><strong>「大丈夫」と言っているららーおを尊重しつつ、それでも心配してくれるか。</strong></p>
      <p>落ち込んでいる人に「大丈夫？」と聞いて、「大丈夫」と返されたら、結構困りますよね。</p>
      <p>もう触れない方がいいのか。<br>もう一回聞いた方がいいのか。<br>何かしてあげた方がいいのか。</p>
      <p>実はららーお自身、どうしてほしいのか明確な正解はありません。</p>
      <p>ただ、非常にめんどくさいことに、</p><p><strong>最終的にどうするかはららーお自身で決めたい。<br>でも、心配はしてほしい。</strong></p>
      <p>という矛盾を抱えています。</p><p>なので、あなたが「何かしてあげたい。でも勝手に踏み込むのも違うし……」とちょっと困っていると、</p><p><strong>（あ、この人めっちゃららーおの扱いに困ってる……）</strong></p><p>と思います。</p><p>そして実は、そのぎこちなさが結構嬉しいです。</p>`, [
      f('A',`<p>あ、気にしてる（笑）。</p><p>「大丈夫」と言ったららーおの言葉は一応受け取ってくれた。</p><p>でも、明らかにまだ心配している。</p><p>その結果、なんとなく近くにいる。</p><p>この「何をするでもないけど、離れるのもちょっと違うと思ってる」感じ、かなり好きです。</p><p>ららーおに何かを強制するわけでもなく、かといって「大丈夫ならいいや」と完全に終わらせるわけでもない。</p><p><strong>そのちょっとした所在なさに、愛を感じています。</strong></p>`),
      f('B',`<p>心配してくれてるのは、めちゃくちゃ伝わります。</p><p>それは普通に嬉しいです。</p><p>ただ、ここでららーおが言っている<strong>「大丈夫」には、実はちょっと特殊な意味があります。</strong></p><p>ららーおは、自分の気持ちを言葉にするのにものすごく時間がかかります。</p><p>だからこの「大丈夫」は、「本当は大丈夫じゃないから察して」ではありません。</p><p>どちらかというと、</p><p><strong>「今聞かれても、まだ自分でもうまく言葉にできない。ちょっと待って。自分のタイミングで話すから」</strong></p><p>という、時間稼ぎの「大丈夫」です。</p><p>なので、すぐにもう一度聞かれると、</p><p><strong>「待って待って、まだ言葉ができてない」</strong></p><p>となります。</p><p>心配してくれていることはちゃんと嬉しい。</p><p>だからこそ、あとちょっとだけ時間をください。</p>`),
      f('C',`<p>これも嬉しいです。</p><p>ららーおが「大丈夫」と言ったことを、そのまま尊重してくれた。</p><p>そして変に腫れ物扱いせず、いつも通り接してくれる。</p><p>かなりありがたいです。</p><p>ただ、ららーおのめんどくさい部分がここで少しだけ顔を出します。</p><p><strong>「大丈夫とは言ったけど……いいんだよ？いいんだけど……ちょっとくらい心配してくれててもいいんだよ？」</strong></p><p>自分で大丈夫と言っておいて何を言っているのでしょうか。</p><p>ららーおもそう思います。</p><p>でも、今は普通に接してくれていて大丈夫です。</p><p>そして、しばらくしてららーおがぽつぽつ話し始めたら、そのときは真摯に聞いてあげてください。</p><p>こちらは散々「大丈夫」と言っておきながら、突然話し始める可能性があります。</p><p>その際は、</p><p><strong>「今なんだ」</strong></p><p>と思いつつ、ご対応をお願いいたします。</p>`),
      f('D',`<p>あーー、気にしてたんだ。</p><p>これは嬉しいです。</p><p>何があったのかは無理に聞かない。</p><p>話すかどうかはららーおに任せる。</p><p>でも、何かしてあげたい気持ちは残っていて、結果、なんか買ってきた。</p><p>この感じがすごく好きです。</p><p>「何があったか話して」とは言わないけど、</p><p><strong>「心配はしてるよ」だけ別ルートから届きました。</strong></p><p>しかも、やっぱり行動で示されるのって、言葉とはまた違った嬉しさがあります。</p><p>ららーおが何も言えていない間にも、「何かできないかな」と考えてくれていたんだな、と分かる。</p><p>ありがとうございます。</p><p>たぶん普通にちょっと元気になります。</p>`),
      f('E',`<p>もちろん、優しいです。</p><p>ららーおが話すタイミングを尊重してくれているし、心配してくれているのもちゃんと分かります。</p><p>ただ、「話したくなったら言ってね」とわざわざ言葉にされると、ららーおはちょっとだけ、</p><p><strong>「あ、心配かけてるな……なんか申し訳ないな」</strong></p><p>という気持ちにもなります。</p><p>これ、言っていること自体は本当に何も悪くないんです。</p><p>むしろららーおが求めていることにかなり近い。</p><p>ただ、これを言葉ではなく態度で示してくれたら、めちゃくちゃ嬉しいです。</p><p>無理に聞かない。<br>でも、なんとなく気にしてくれている。<br>ららーおが話し始めたら、ちゃんと聞く。</p><p>その「いつでも聞くよ」が言葉にせず伝わってくる感じ。</p><p>ららーおはそっちの方が好きです。</p>`),
    ]),

  q(8, 'ららーおが一日の予定をかなり調べてきました', `
    <p class=\"situation\">あなたとららーおは、前から楽しみにしていたお出かけの当日を迎えました。</p>

    <p><strong>さて、あなたならどうしちゃう？</strong></p>`, [

      o('B','気にはなるけど、今日はららーおが考えた予定通りに過ごす',7),
      o('C','予定を崩さずに行ける方法がないか調べてから、追加できそうなら提案する',10),
      o('D','「予定は予定だし、そのとき行きたい方行こうよ」と当日の気分を優先する',0),
      o('E','ららーおが予定変更を嫌がりそうなので、気になったこと自体を言わない',3),
    ], '🗓️ この問題で見ていたこと', `
      <p><strong>ららーおが事前に組んだ予定を、どのくらい「もう始まっているもの」として扱ってくれるか。</strong></p>

      <p>そして誰にも言っていませんが、実はその日をゴールにして、こっそり自分のコンディションまで整えています。</p>

      <p>なので、ららーおにとって予定変更は単なるスケジュールの書き換えではありません。</p><p>気分とコンディションの変更もセットです。</p>

      <p>ただその瞬間、</p><p><strong>すでに完成しかけていた今日のららーおを、一旦組み直しています。</strong></p>`, [
      f('A',`<p>全然言ってください。</p><p>予定を組んだからといって、一切の変更を受け付けないわけではありません。</p><p>「ここ気になるんだけど、行けそう？」と相談してくれるなら、一緒に考えます。</p><p>入れられそうなら入れるし、難しそうならまた今度でもいい。</p><p>ただららーおはすでに今日の予定の気分になっているので、変更には少々お時間をいただく場合がございます。</p><p>一旦、脳内スケジュールを開きます。</p>`),
      f('B',`<p>ありがとうございます。</p><p>ららーおが事前にいろいろ調べて組んだ予定を、そのまま一緒に楽しんでくれる。</p><p>普通にかなり嬉しいです。</p><p>しかもあなたには別に気になる場所があったのに、</p><p>「今日はこの予定でいこう」</p><p>と思ってくれたんですね。</p><p>その場所はぜひ次回行きましょう。</p><p>次の予定を組むときには、喜んで候補に入れさせていただきます。</p>`),
      f('C',`<p>これは嬉しい。</p><p>自分の行きたいところもちゃんとある。</p><p>でも、そのためにららーおが組んだ予定を全部崩すのではなく、</p><p>「これを残したまま、こっちも行けないかな」</p><p>と考えてくれた。</p><p>ららーおが事前に考えてきたものも大事にしながら、自分の希望もちゃんと出してくれている。</p><p>しかも、すでにある程度調べてくれています。</p><p>話が早い。非常に助かります。</p><p>行けそうならぜひ行きましょう。</p><p>ららーおも納得した瞬間から、ものすごい勢いで新しい予定の気分になります。</p>`),
      f('D',`<p>ららーおはその予定のために、もう数日前からその日の気分になっています。</p><p>「今日はここに行く」「これを食べる」「こう過ごす」まで含めて、ららーおの中ではすでに当日の準備が始まっています。</p><p>なので当日になって、</p><p>「そのとき行きたい方でよくない？」</p><p>と言われると、</p><p><strong>いや、ららーおはもう“そっちに行くららーお”として今日を迎えてるんですけど。</strong></p><p>となります。</p><p>予定表だけを変更しているつもりかもしれませんが、こちらは気分ごと差し替えが必要です。</p><p>変更するなら、せめてららーおの気分にも移行時間をください。</p>`),
      f('E',`<p>いや、言ってはほしいです（笑）。</p><p>予定を変えられるのが苦手なのと、あなたの希望を聞きたくないのは別の話です。</p><p>「実はここもちょっと気になってる」くらいなら、全然聞きたい。</p><p>もしかしたら予定に入れられるかもしれないし、今回は無理でも次に行けるかもしれません。</p><p>何も言わずに一日過ごしたあとで、「実はあそこ行きたかったんだよね」と言われたら、</p><p><strong>「それは言ってよ！」</strong></p><p>となります。</p><p>ららーおの予定を尊重してくれたのは嬉しい。</p><p>でも、あなたの希望まで予定表から削除しなくて大丈夫です。</p>`),
    ]),

  q(9, 'ららーおの好きな曲が、あなたには刺さりませんでした', `
    <p class=\"situation\">あなたとららーおは、同じ部屋でおすすめの音楽を聴いています。</p>

    <p><strong>さて、あなたならどうしちゃう？</strong></p>`, [

      o('C','「最初の雰囲気は結構好きだったんだけど、サビに入った瞬間ちょっと違うなって思って。あと途中から入ってくる音もあんまり好きじゃないかも。ボーカルの歌い方もららーおはちょっと苦手だし、曲の展開も思ってた感じと違ったかな。最後まで聴いたけど、たぶんもう一回聴きたいとはならないかも。でもイントロは良かったよ！」',3),
      o('D','「こういう系、あんまり良さ分からんかも」',0),
      o('E','「じゃあ次、ららーおの好きな曲も聴いてよ」',3),

      <p>自分の大好きな曲を誰かに聴かせるときって、もちろん「いい曲！」と言ってもらえたら嬉しいです。</p>
      <p>でもららーおは、相手にも同じように好きになってほしいわけではありません。</p>

      <p>ららーおが欲しいのは、あなた自身の感想です。</p>`, [
      f('A',`<p>全然OKです。</p><p>ちゃんと聴いたうえで、「ららーおはあんまり好きじゃない」と思ったなら、それがあなたの感想です。</p><p>ららーおが好きな曲だからといって、あなたまで好きになる必要はありません。</p><p>むしろ変に合わせられるより、素直に言ってくれる方が嬉しいです。</p><p>たぶんららーおは、「あ、そうなんだ」くらいで普通に終わります。</p><p>ららーおが好きなのと、あなたが好きなのは別の話。</p><p>そこはそれぞれ自由でいきましょう。</p>`),
      f('B',`<p>優しい。</p><p>ららーおが好きな曲だから、たぶん気を遣ってくれたんですよね。その気遣い自体は嬉しいです。</p><p>でも実は、好きじゃなかったなら、好きじゃなかったって言ってくれて全然大丈夫です。</p><p>ららーおは「この曲いいでしょ？ね？いいでしょ？」と、同意を取りに来ているわけではありません。</p><p>あなたがどう感じたのかを知りたい。</p><p>なので、ららーおの好きなものに対して、無理に正解を出さなくて大丈夫です。</p><p>というか、ここで「いい曲だね」って言っても、</p><p><strong>そのあと結局、自分では聴かないでしょ？</strong></p><p>たぶんららーおは、そっちの方が傷つきます。</p><p>「好きじゃなかった」は、その場で聞けば「あ、そうなんだ」で終われます。</p><p>でも「いい曲だね」と言われたら、ららーおは普通に<strong>「気に入ったんだ」って受け取ります。</strong></p><p>そして後から、あ、全然聴いてないんだ。と気づく。</p><p>だったら最初から、「ららーおはあんまり好きじゃないかも」って言ってくれた方が、ずっと嬉しいです。</p>`),
      f('C',`<p>めちゃくちゃちゃんと聴いてくれたんですね。</p><p>ありがとうございます。</p><p>そこまで具体的な感想が出てくるということは、適当に聞き流さず、一曲ちゃんと聴いてくれたんだと思います。</p><p>それは嬉しいです。</p><p>ただ、</p><p><strong>そんなに詳しく嫌だったところを教えてくれなくても大丈夫です（笑）。</strong></p><p>サビが苦手。<br>途中から入ってくる音も苦手。<br>歌い方も苦手。<br>展開も思ってた感じと違う。<br>もう一回聴きたいとは思わない。</p><p>分かりました。もう十分伝わっております。</p><p>ららーおはこの曲が大好きなので、ネガティブな感想については、もう少しコンパクトにまとめていただけると助かります。</p><p>そして最後に、「でもイントロは良かったよ！」</p><p>ありがとうございます。</p><p>ありがとうございますけど、</p><p><strong>その一言でここまでのすべてを回収できると思わないでください（笑）。</strong></p><p>散々言ったあとに突然差し込まれる謎のフォローに、ららーおはちょっとだけイラッとしています。</p><p>ちなみに、これが全部ポジティブな感想だった場合は、同じ文字数でも喜んで最後まで聞きます。</p><p>つまり問題なのは長さではありません。</p><p><strong>ネガティブの詳細は、そんなにいらないんです。</strong></p>`),
      f('D',`<p>これはちょっと傷つきます。</p><p>「ららーおはこの曲が好きじゃない」なら全然いいんです。</p><p>でも、「こういう音楽の良さが分からない」まで広げられると、ららーおが好きでいることまで少し否定されたように感じます。</p><p>ららーおはこの音楽が好きなことに自信もあるし、普通に胸を張って好きだと思っています。</p><p>だから、</p><p><strong>好きじゃないのは全然いい。でも、良さが分からないまで言わなくてもいいじゃん。</strong></p><p>となります。</p><p>あなたの感性を変えてほしいわけではありません。</p><p>ただ、ららーおがこれを好きなことも、そのまま置いておいてください。</p>`),
      f('E',`<p>もちろん、聴きます。</p><p>聴くんですけど。</p><p>曲が終わって、「じゃあ次、ららーおの好きな曲も聴いてよ」となると、</p><p><strong>あ、もう次いくんだ……。</strong></p><p>と、ちょっと拍子抜けします。</p><p>別に刺さらなかったことは全然いいんです。</p><p>「好きじゃなかった」でもいいし、「あんまりハマらなかった」でもいい。</p><p>ただららーおはこの曲が好きで、「ちょっとこれ聴いて！」の気持ちで流しています。</p><p>なので、聴き終わったあとに何か一言あるかなと思っていたら、そのまま次の曲へ。</p><p>ららーおの中ではまだ、ほんの少しだけ余韻が残っています（笑）。</p><p>あなたの好きな曲もちゃんと聴きます。</p><p>むしろ、どんな曲が好きなのかは気になります。</p><p>ただその前に、</p><p><strong>今聴いたららーおのおすすめにも、一言だけ置いていってください。</strong></p>`),

  q(10, 'あなたがちょっとしたミスをしました', `

      <p>野球を知らなくても、なんとなく<strong>「今たぶん話しかけない方がいいやつ」</strong>という空気は感じるかもしれません。</p>
      <p>でも実はららーお、全然話しかけて大丈夫です。</p>
      <p>むしろここで大事なのは、<strong>あなたも甲子園を好きかどうかではありません。</strong></p>
      <p>ららーおが好きな甲子園に、あなたがどう興味を持ってくれるかです。</p>`, [
      f('A',`<p><strong>え、説明させてもらえるんですか？？</strong></p><p>これが一番嬉しいです。</p><p>野球を知らないことなんて、全然問題ありません。</p><p>むしろ、「今どういう状況？」と聞いてくれた瞬間、ららーおに甲子園を説明するためのステージが用意されます。</p><p>2アウトとは何か。<br>なぜ2塁3塁がヤバいのか。<br>1点入ったらどうなるのか。</p><p>聞かれたこと以上に説明する可能性があります。</p><p><strong>ららーおにマイクを渡したのはあなたです。</strong></p>`),
      f('B',`<p><strong>めっちゃ嬉しいです。</strong></p><p>ルールをどこまで分かっているかは、もはやどうでもいい。</p><p>ららーおが盛り上がっているものに、一緒になって盛り上がってくれている。</p><p>それだけでかなり嬉しいです。</p><p>たぶんららーおも普通に、</p><p><strong>「いけーーー！！！」</strong></p><p>となっているので、一緒に騒ぎましょう。</p><p>ただし誰を応援しているのかは、一応確認させてください。</p>`),
      f('C',`<p>これも全然いいです。</p><p>ららーおとしては試合に釘付けなので、横で静かに一緒に見てくれているだけでも普通に嬉しい。</p><p>ふと横を見て、</p><p><strong>（あ、一緒に見てる）</strong></p><p>くらいです。</p><p>無理に盛り上がらなくても大丈夫。</p><p>ららーおは勝手に盛り上がっています。</p>`),
      f('D',`<p>まあ、いいでしょう（笑）。</p><p>ららーおは甲子園を見ています。</p><p>あなたはららーおを見ています。</p><p><strong>同じテレビの前にいるのに、見ているコンテンツが違います。</strong></p><p>でもららーおが一喜一憂しているのを面白がっているなら、それはそれで全然構いません。</p><p>ららーおはたぶん、あなたに見られていることにも気づかず甲子園を見ています。</p>`),
      f('E',`<p>話しかけてもらうこと自体は、実は全然嫌じゃないです。</p><p>普通に返事もします。</p><p>ただ。</p><p><strong>今、9回裏2アウト2塁3塁1点差です。</strong></p><p>あなたが今日あった出来事を話している横で、ららーおの意識の8割くらいはテレビにいます。</p><p>話は聞きます。</p><p>聞きますが、</p><p><strong>できればその話、甲子園のサイレンが鳴り終わるまで待ってもらえると大変助かります。</strong></p>`),
    ]),

  q(12, 'ららーおの甲子園が終わりました', `
    <p class=\"situation\">あなたとららーおは、夏の終わりにテレビの前で閉会式を見届けました。</p>
    <p><strong>閉会式とともに、ららーおの夏も終わりました。</strong></p><p>ららーおはテレビの前にいます。</p>
    <p><strong>さて、あなたならどうしちゃう？</strong></p>`, [
      o('A','「今年もいい夏だったね」',7),
      o('B','「今年はどこが一番印象に残った？」',10),
      o('C','「めっちゃ楽しそうだったね（笑）」',5),
      o('D','特に何も言わない',3),
      o('E','普通に別の話をする',0),
    ], '🏟️ この問題で見ていたこと', `
      <p><strong>甲子園が全部終わったあと、ららーおの「好き」にどこまで付き合ってくれるか。</strong></p>

      <p>ただ、別に落ち込んでいるわけではありません。</p>
      <p>むしろ今のららーおは、<strong>今年の甲子園について非常に語りやすい状態です。</strong></p>`, [
      f('A',`<p><strong>いい夏だったね。</strong></p><p>これ、嬉しいです。</p><p>あなたが甲子園をどれだけ見ていたかは関係なく、</p><p><strong>「ららーおにとって甲子園＝夏」</strong></p><p>という感覚に一緒に乗ってくれている感じがします。</p><p>閉会式まで見届けたららーおとしては、かなり気持ちのいい締めです。</p>`),
      f('B',`<p><strong>え、感想聞いてくれるんですか？？</strong></p><p>ありがとうございます。</p><p>では今年の甲子園について、振り返らせていただきます。</p><p>印象に残った試合、選手、プレー、展開……</p><p>おそらく「どこが一番？」と聞かれたのに、<strong>一つでは終わりません。</strong></p><p>Q11に引き続き、またららーおにマイクが渡りました。</p><p>何度でも言います。</p><p><strong>ららーおにマイクを渡したのはあなたです。</strong></p>`),
      f('C',`<p><strong>楽しそうだったでしょ（笑）。</strong></p><p>今年も存分に楽しみました。</p><p>甲子園そのものというより、<strong>甲子園を見ているららーおを見ていた</strong>んですね。</p><p>それも結構嬉しいです。</p><p>「あ、この人ほんとに甲子園好きなんだな」と思ってもらえていたなら、それで十分。</p><p>ただ、せっかくなので今なら、</p><p><strong>「今年どうだった？」</strong></p><p>まで聞いてくれると、喜んで感想戦を始めます。</p>`),
      f('D',`<p>全然大丈夫です。</p><p>ららーおは今、今年の甲子園を最後まで見届けて、<strong>一人でかなりいい気分になっています。</strong></p><p>なので、何も言われなくても特にマイナスではありません。</p><p>しばらく余韻に浸っています。</p><p>ただ、ららーおの中には今、</p><p><strong>今年の甲子園について喋れることが大量にあります。</strong></p><p>質問されれば、いつでも開きます。</p><p>現在、<strong>甲子園トークの扉は閉まっていますが、鍵はかかっていません。</strong></p>`),
      f('E',`<p>はい、普通の生活に戻りました。</p><p>甲子園も終わったので、別の話をしても全然大丈夫です。</p><p>ただららーおの中には今、</p><p><strong>今年の甲子園について喋れることが大量にあります。</strong></p><p>あなたが別の話を始めたので、それらは一旦すべて胸の中にしまいます。</p><p>ららーおの夏は終わりました。</p><p><strong>甲子園トークも、そのまま静かに閉幕しました。</strong></p>`),
    ]),

  q(13, 'あなたが突然、好きな曲を流し始めました', `
    <p class=\"situation\">あなたとららーおは、家で音楽を流しながらのんびり過ごしています。</p>
    <p>二人で同じ部屋にいます。</p><p>今度は、あなたが突然好きな曲を流し始めました。</p><p>ららーおはこの曲を知りませんでしたが、結構いい曲です。</p><p>曲が終わりました。</p>
    <p><strong>さて、ららーおが取る行動は？</strong></p>`, [
      o('A','「これなんて曲？」と聞く',7),
      o('B','何も言わず最後まで聴いて、その後も特に触れない',0),
      o('C','「これなんて曲？めっちゃいい！」と言ったあと、少しして自分の好きな曲も流す',10),
      o('D','「こういう曲好きなんだ」と、あなたの音楽の好みについて聞く',5),
      o('E','「じゃあ次これ聴いて」と、すぐに自分の好きな曲を流す',3),
    ], '🎧 この問題で見ていたこと', `
      <p><strong>Q1の完全反転です。</strong></p>
      <p>Q1では、ららーおが突然好きな曲を流しました。</p><p>そしてららーおは、</p><p><strong>曲が終わるまで聴いて、そのあと「これなんて曲？」と聞いてもらえるのが一番嬉しい</strong></p><p>と言っていました。</p>
      <p>では逆に、あなたが突然いい曲を流したら、ららーおはどうするのか。</p>
      <p>まず、ちゃんと聴きます。</p><p>いい曲だったら普通にいい曲だと思うし、気になったら、「これなんて曲？めっちゃいい！」と聞きます。</p>
      <p>ここまでは非常に平和です。</p><p>ただし。</p><p>心の片隅に、小さく、</p><p><strong>「……先越されたな」</strong></p><p>がいます。</p>
      <p>あなたの曲がいい曲だったことと、ららーおもいい曲を流したかったことは、まったく別の話です。</p>
      <p>あなたの選曲には素直に感動しています。</p><p>でも同時に、</p><p><strong>ららーおにも一曲やらせてほしい。</strong></p>
      <p>そんな、音楽の主導権をめぐる誰にも頼まれていない小さな攻防を、ららーおは一人で開催しています。</p>`, [
      f('A',`<p>かなりやります。</p><p>知らない曲で、しかもいい曲だったら、普通に気になります。</p><p>「これなんて曲？」と聞いて、アーティストや曲名を教えてもらいます。</p><p>そしてたぶんそのあと、ちょっと自分でも調べます。</p><p>他にどんな曲があるんだろうとか、さっきの曲もう一回聴いてみようかなとか。</p><p>いいと思ったものには、普通にちゃんと興味を持ちます。</p><p>あなたの曲が気になって調べることと、ららーおも何か流したいこと。</p><p>この二つは問題なく同時に存在します。</p><p>そして一通り調べたところで、</p><p><strong>「……じゃあ次、ららーお流していいですか？」</strong></p>`),
      f('B',`<p>これはしません。</p><p>いいと思ったものに対して、何も反応しないなんてことはたぶんありません。</p><p>知らない曲なら、「これなんて曲？」と聞くだろうし、本当にいいと思ったなら、「めっちゃいい！」とも普通に言います。</p><p>Q1では、ららーおが曲を流したあとに何も言われないと、「何かしら触れてほしいな」と思っていました。</p><p>そして逆の立場になったとき、ららーおは普通に触れます。</p><p>ここはちゃんと平等です。</p><p>というより、いいと思ったのに黙っておく理由があんまりありません。</p><p>いいものはいい。気になったものは気になる。</p><p>そのへんはかなり素直です。</p><p>なのでこれは、ららーおとしてはかなり遠い選択肢です。</p>`),
      f('C',`<p>たぶん、これです。</p><p>あなたの曲が本当にいいと思ったので、「これなんて曲？めっちゃいい！」と普通に聞きます。</p><p>そこに嘘はありません。</p><p>ちゃんとあなたの曲を楽しんでいるし、曲名も知りたい。</p><p>でも、あなたが先に曲を流した瞬間から、心のどこかにはずっと、</p><p><strong>「あ、先越された」</strong></p><p>がいます。</p><p>あなたの曲がいい曲だったことと、ららーおもいい曲を流したかったことは、まったく別の話です。</p><p>なので、ちゃんと感想も言って、曲名も聞いて、あなたの一曲を十分楽しんだところで。</p><p>たぶんららーおは、何食わぬ顔でスマホを持って、</p><p><strong>「……じゃあ次、ららーお流していいですか？」</strong></p><p>と聞きます。</p><p>先攻は取られました。後攻でいきます。</p>`),
      f('D',`<p>これも普通にあります。</p><p>音楽が好きなので、「この人こういう曲好きなんだ」と分かるのは面白いです。</p><p>「他には何聴くの？」とか、「こういう系が好きなの？」とか、あなたの音楽の好みについて聞くのも楽しい。</p><p>最初のうちは、普通に興味を持って聞いています。</p><p>ただ、音楽の話を聞けば聞くほど、</p><p>「あ、それならららーおも聴いてほしい曲ある」</p><p>「この曲好きなら、あれも流したい」</p><p>と、ららーおの中でも紹介したい曲がどんどん増えていきます。</p><p>そして気づけば、あなたの話を聞きながら、頭の中ではもう次に流す曲の候補が何曲か並んでいます。</p><p>まだあなたのターンです。</p><p>分かっています。</p><p>分かってはいるんですが、そろそろこちらも参加したくなってきました。</p><p><strong>「……じゃあ次、ららーお流していいですか？」</strong></p>`),
      f('E',`<p>気持ちはめちゃくちゃ分かります。</p><p>というか、たぶんららーおもかなり早い段階から、「ららーおもなんか流したい」とは思っています。</p><p>なので「次は自分の曲を流したい」というところまでは、かなりららーおです。</p><p>ただ、</p><p><strong>そのまま流し始めるのは違います。</strong></p><p>あなたが流してくれた曲がいい曲だったなら、「これなんて曲？」とか、「めっちゃいい！」とか、まずはちゃんとその曲に反応します。</p><p>Q1でららーお自身、せっかく流した曲に何も触れられないと物足りないと思っていました。</p><p>なので、自分が逆の立場になったときも、そこはちゃんとやります。</p><p>そして、あなたの一曲をちゃんと受け取ったあと。</p><p>もう自分の中では流したい曲も決まっています。</p><p>スマホもたぶん手に持っています。</p><p>でも、勝手には流しません。</p><p>一応あなたの顔を見て、</p><p><strong>「……じゃあ次、ららーお流していいですか？」</strong></p>`),
    ]),

  q(14, 'ららーおがちょっとしたミスをしました', `
    <p class=\"situation\">あなたとららーおは、一緒に過ごしている最中です。</p>
    <p>ららーおがあなたに対して、ちょっとしたミスをしました。</p><p>怒るほど大きなことではありません。</p><p>ただ、「まあ別にいいけど、地味に印象には残るな」くらいのミスです。</p><p>ららーおから見た感じ、あなたはそこまで怒ってはいなさそうです。</p>
    <p><strong>さて、ららーおはどうしちゃう？</strong></p>`, [
      o('A','きちんと謝って、あなたが「もう大丈夫」と言ったらそこで謝るのをやめる',3),

      o('E','謝らないが、その分あとから行動で埋め合わせる',3),
    ], '🙇 この問題で見ていたこと', `
      <p><strong>Q10の完全反転です。</strong></p>
      <p>さっきららーおは、</p><p><strong>「謝罪は一回ちゃんとしてくれれば十分」</strong></p><p>と言いました。</p>
      <p>何度も謝らなくてもいいし、ららーおが「もう大丈夫」と言ったら普通に戻ってくれていい。</p>
      <p>では、自分がミスした側になったらどうするのか。</p><p><strong>何度も謝ります。</strong></p>
      <p>相手には「一回でいいよ」と思っているのに、自分は一回ではなかなか終われません。</p>
      <p>あなたが「もう大丈夫」と言ってくれても、</p><p><strong>「いや、でもほんとごめん」</strong></p><p>がたぶんもう一回出ます。</p>
      <p>Q10では最初の「ごめん」を入場券と呼びました。</p><p>他人には一枚見せてもらえれば十分です。</p>
      <p>なのに自分の番になると、</p><p><strong>頼まれてもいないのに入場券を何枚も提出します。</strong></p><p>非常に非効率です。</p>`, [
      f('A',`<p>これができたら一番いいと思います。</p><p>ちゃんと謝った。</p><p>相手も「もう大丈夫」と言ってくれた。</p><p>話は終わっています。</p><p>頭では分かっています。</p><p>でも、</p><p><strong>「……いや、でもほんとごめん」</strong></p><p>が出ます。</p><p>あなたの「大丈夫」を信用していないわけではありません。</p><p>ただ、ららーおの申し訳なさがまだ終わっていません。</p><p>相手には一回で十分と言っておきながら、自分は一回で退場できません。</p>`),
      f('B',`<p>これはしません。</p><p>ミスが小さいことは分かっています。</p><p>あなたがそんなに怒っていないことも分かっています。</p><p>でも、自分が悪かったと思っているなら、ミスの大きさに合わせて謝罪まで軽くする、という発想にはなりません。</p><p>たぶん「ごめんごめん（笑）」みたいに言った瞬間、ららーお自身が一番その謝り方を許せません。</p><p>「いや、今の違うな」となって、結局ちゃんと謝り直します。</p><p>Q10では、</p><p><strong>小さいミスでも、その一瞬はちゃんと謝ってほしい</strong></p><p>と言っていました。</p><p>当然、自分にも同じルールを適用します。</p><p>というか自分の場合、そこからさらに何回か謝います。</p><p>軽く一回で終わる未来は、かなり遠いです（笑）。</p>`),
      f('C',`<p>はい、これです。</p><p>一回ちゃんと謝ります。</p><p>あなたも、「大丈夫だよ」と言ってくれます。</p><p>普通ならここで終了です。</p><p>でも少し経って、</p><p><strong>「いや、ほんとごめんね」</strong></p><p>が出ます。</p><p>さらに何かの拍子に思い出して、</p><p><strong>「ていうかさっきの、本当にごめん」</strong></p><p>がもう一回来る可能性があります。</p><p>別に許してもらえていないと思っているわけではありません。</p><p>ららーおの中の申し訳なさの処理に時間がかかっています。</p><p>Q10では何度も謝られると、途中からららーおが相手を罪悪感から解放しようとしていました。</p><p>今回は逆です。</p><p><strong>誰かららーおを罪悪感から解放してください。</strong></p>`),
      f('D',`<p>これはありません。</p><p>あなたが怒っているかどうかにかかわらず、自分が悪かったと思ったら謝ります。</p><p>むしろ「怒ってなさそうだから謝らなくていいか」という発想には、たぶんなりません。</p><p>Q10でも言いましたが、</p><p><strong>怒っていないことと、謝らなくていいことは別です。</strong></p><p>相手には入場券を求めるのに、自分だけ顔パスで入ろうとはしません。</p><p>むしろ入場券、多めに持ってきます。</p>`),
      f('E',`<p>行動で埋め合わせること自体は、たぶんします。</p><p>「何かできることないかな」と考える可能性もあります。</p><p>ただ、</p><p><strong>謝らずに行動だけで済ませることはありません。</strong></p><p>Q10で人には、「お気持ちは分かりました。入場券を見せてください」と言っていた人間です。</p><p>自分だけ行動で突破しようとするわけにはいきません。</p><p>まず謝る。</p><p>必要なら行動でも示す。</p><p>そしてたぶん、そのあともう一回謝ります。</p><p>入場券、一枚でいいはずなんですけどね（笑）。</p>`),
    ]),

  q(15, 'ららーおが13時に待ち合わせをしています', `

    ]),

let current = 0;
let answers = Array(questions.length).fill(null);
let playerName = '';

const $ = (id) => document.getElementById(id);
const screens = ['start-screen','quiz-screen','result-screen','answers-screen'];

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
  })[ch]);
}

function personalize(value) {
  return String(value).replaceAll('あなた', escapeHtml(playerName || 'あなた'));
}

function showScreen(id) {
  screens.forEach(s => $(s).classList.toggle('is-active', s === id));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuestion() {
  const item = questions[current];
  $('question-number').textContent = `QUESTION ${String(current + 1).padStart(2,'0')} / ${questions.length}`;
  $('progress-bar').style.width = `${((current + 1) / questions.length) * 100}%`;
  $('player-name').textContent = playerName ? `${playerName}さん` : '';
  $('question-title').innerHTML = `Q${current + 1}｜${personalize(item.title)}`;
  $('question-body').innerHTML = personalize(item.body);
  $('options').innerHTML = '';

  item.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = `option-btn${answers[current] === opt.letter ? ' is-selected' : ''}`;
    btn.type = 'button';
    btn.innerHTML = `<span class="option-letter">${opt.letter}</span><span class="option-text">${personalize(opt.text)}</span>`;
    btn.addEventListener('click', () => {
      answers[current] = opt.letter;
      renderQuestion();
    });
    $('options').appendChild(btn);
  });

  $('back-btn').disabled = current === 0;
  $('next-btn').disabled = answers[current] === null;
  $('next-btn').textContent = current === questions.length - 1 ? '結果を見る →' : '次へ →';
}

function getStats() {
  let total = 0;
  let zeroCount = 0;
  let tenPlusCount = 0;
  questions.forEach((item, i) => {
    const selected = item.options.find(opt => opt.letter === answers[i]);
    total += selected.score;
    if (selected.score === 0) zeroCount++;
    if (selected.score >= 10) tenPlusCount++;
  });
  return { total, zeroCount, tenPlusCount };
}

function getResult() {
  const { total, zeroCount, tenPlusCount } = getStats();
  const q15Correct = answers[14] === 'E';
  if (total === 160) return results.stage;
  if (total >= 120 && !q15Correct) return results.wrongDate;
  if (zeroCount >= 10 && tenPlusCount <= 2) return results.wrongLive;
  if (total >= 130) return results.front;
  if (total >= 100) return results.arena;
  if (total >= 70) return results.stand;
  if (total >= 40) return results.lobby;
  return results.home;
}

function renderResult() {
  const { total } = getStats();
  const result = getResult();
  $('result-name').textContent = `${playerName}さんの響きあい度`;
  $('result-kicker').textContent = result.kicker;
  $('result-icon').textContent = result.icon;
  $('result-title').textContent = result.title;
  $('result-score').textContent = `${total} / 160 POINTS`;
  $('result-copy').innerHTML = personalize(result.copy);
  $('copy-status').textContent = '';
  showScreen('result-screen');
}

function renderAnswers() {
  const container = $('answer-list');
  container.innerHTML = '';
  $('answer-player-name').textContent = playerName;

  questions.forEach((item, idx) => {
    const selectedLetter = answers[idx];
    const selectedOption = item.options.find(opt => opt.letter === selectedLetter);
    const details = document.createElement('details');
    details.className = 'answer-block';
    if (idx === 0) details.open = true;

    const summary = document.createElement('summary');
    summary.innerHTML = `<h3>Q${idx + 1}｜${personalize(item.title)}</h3><span class="selected-summary">${escapeHtml(playerName)}：${selectedLetter} / ${selectedOption.score}点</span>`;
    details.appendChild(summary);

    const content = document.createElement('div');
    content.className = 'answer-content';
    content.innerHTML = `<div class="intent"><h4>${personalize(item.intentTitle)}</h4>${personalize(item.intentHtml)}</div>`;

    item.options.forEach(opt => {
      const feedback = item.feedback.find(x => x.letter === opt.letter);
      const section = document.createElement('section');
      section.className = `feedback-item${selectedLetter === opt.letter ? ' is-user-choice' : ''}`;
      const celebration = opt.score === 10 ? '<span class="perfect-mark" aria-label="10点">🎉</span>' : '';
      section.innerHTML = `
        <div class="feedback-title">
          <span class="answer-open-label">【${opt.letter}】</span>
          <span class="answer-open-text">${personalize(opt.text)}</span>
          <span class="score-parentheses">（<strong class="score-value">${opt.score}点</strong>）</span>${celebration}
          ${selectedLetter === opt.letter ? `<span class="your-choice-chip">${escapeHtml(playerName)}さんの回答</span>` : ''}
        </div>
        ${personalize(feedback.html)}`;
      content.appendChild(section);
    });

    details.appendChild(content);
    container.appendChild(details);
  });
  showScreen('answers-screen');
}

function resetQuiz() {
  current = 0;
  answers = Array(questions.length).fill(null);
  showScreen('start-screen');
}

$('start-btn').addEventListener('click', () => {
  const input = $('nickname-input').value.trim();
  if (!input) {
    $('name-error').textContent = 'ニックネームを入力してください。';
    $('nickname-input').focus();
    return;
  }
  playerName = input;
  $('name-error').textContent = '';
  current = 0;
  answers = Array(questions.length).fill(null);
  renderQuestion();
  showScreen('quiz-screen');
});

$('nickname-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('start-btn').click();
});

$('back-btn').addEventListener('click', () => {
  if (current > 0) { current--; renderQuestion(); }
});

$('next-btn').addEventListener('click', () => {
  if (answers[current] === null) return;
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    renderResult();
  }
});

$('open-answers-btn').addEventListener('click', renderAnswers);
$('back-result-btn').addEventListener('click', () => showScreen('result-screen'));
$('restart-btn').addEventListener('click', resetQuiz);
$('restart-btn-top').addEventListener('click', resetQuiz);
$('restart-btn-bottom').addEventListener('click', resetQuiz);

$('copy-result-btn').addEventListener('click', async () => {
  const { total } = getStats();
  const result = getResult();
  const text = `${playerName}さんの「ららーおとあなたの心の響きあい度診断」
${total} / 160 POINTS
${result.icon} ${result.title}`.replaceAll('あなた', playerName);
  try {
    await navigator.clipboard.writeText(text);
    $('copy-status').textContent = '結果をコピーしました！';
  } catch {
    $('copy-status').textContent = 'コピーできませんでした。';
  }
});
