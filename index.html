<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- RARAO FINAL BUILD: 2026-08-14-01 -->
  <meta name="theme-color" content="#10163f" />
  <meta name="description" content="ららーおとあなたの心の響きあい度診断。全15問のシチュエーションから、二人の響きあい度を診断します。" />
  <title>ららーおとあなたの心の響きあい度診断</title>
  <link rel="stylesheet" href="app-20260814.css" />
</head>
<body>
  <div class="stars stars-a" aria-hidden="true"></div>
  <div class="stars stars-b" aria-hidden="true"></div>

  <main class="wrap">
    <section id="start-screen" class="screen is-active">
      <article class="card start-card">
        <div class="sparkle" aria-hidden="true">✦</div>
        <div class="tag">🎧 全15問・160点満点</div>
        <h1>ららーおとあなたの<br><span>心の響きあい度診断</span></h1>
        <p class="intro-copy">正解を当てにいくクイズではありません。<br>それぞれの場面で、<strong>あなたなら実際どうしちゃうか</strong>を選んでください。</p>
        <p class="intro-copy muted">あなたとららーおの心はどのくらい響きあっているのか、早速確かめてみましょう！</p>

        <div class="name-box">
          <label for="nickname-input">ニックネーム</label>
          <input id="nickname-input" type="text" maxlength="20" autocomplete="nickname" placeholder="例：ららとも" />
          <p id="name-error" class="name-error" aria-live="polite"></p>
        </div>

        <button id="start-btn" class="btn primary" type="button">診断をはじめる</button>
      </article>
      <p class="foot">ららーおとあなたの心の響きあい度診断 🎤</p>
    </section>

    <section id="quiz-screen" class="screen" aria-live="polite">
      <article class="card quiz-card">
        <div class="quiz-topline">
          <span id="question-number" class="progress-label"></span>
          <span id="player-name" class="player-name"></span>
        </div>
        <div class="bar"><div id="progress-bar" class="bar-in"></div></div>

        <h2 id="question-title"></h2>
        <div id="question-body" class="question-body"></div>
        <div id="options" class="choices"></div>

        <div class="quiz-actions">
          <button id="back-btn" class="btn ghost" type="button">← 前の問題</button>
          <button id="next-btn" class="btn primary" type="button" disabled>次へ</button>
        </div>
        <button id="restart-btn-top" class="link-btn" type="button">最初からやり直す</button>
      </article>
    </section>

    <section id="result-screen" class="screen">
      <article class="card result-card">
        <div class="tag">🎤 診断結果</div>
        <p id="result-name" class="result-name"></p>
        <div id="result-icon" class="result-icon"></div>
        <p id="result-kicker" class="result-kicker"></p>
        <h2 id="result-title"></h2>
        <div id="result-score" class="score"></div>
        <div id="result-copy" class="result-copy"></div>

        <button id="copy-result-btn" class="btn primary" type="button">結果をコピー</button>
        <p id="copy-status" class="copy-status" aria-live="polite"></p>
        <button id="open-answers-btn" class="btn ghost" type="button">回答オープンを見る</button>
        <button id="restart-btn" class="link-btn" type="button">もう一度やる</button>
      </article>
    </section>

    <section id="answers-screen" class="screen">
      <article class="card answers-card">
        <div class="answers-head">
          <div>
            <div class="tag">📖 ANSWER OPEN</div>
            <h2>回答オープン</h2>
            <p class="muted"><span id="answer-player-name"></span>さんが選んだ回答は色付きで表示されます。</p>
          </div>
          <button id="back-result-btn" class="btn ghost small-btn" type="button">結果に戻る</button>
        </div>
        <div id="answer-list" class="answer-list"></div>
        <button id="restart-btn-bottom" class="btn primary" type="button">もう一度やる</button>
      </article>
    </section>
  </main>

  <script src="app-20260814.js"></script>
</body>
</html>
